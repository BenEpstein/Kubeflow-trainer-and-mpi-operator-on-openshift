<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ring" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <!-- title -->
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">AllReduce: semantically all-to-all, physically not</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#64748b">Every GPU ends up with the sum of everyone's data — but the traffic on the wire is a ring or a tree, not a full N×N mesh.</text>

  <line x1="600" y1="92" x2="600" y2="430" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== RING ===== -->
  <text x="300" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">RING</text>
  <text x="300" y="144" text-anchor="middle" font-size="12.5" fill="#64748b">Horovod / NCCL default — talk to 2 neighbors only</text>

  <!-- ring nodes -->
  <g>
    <circle cx="300" cy="200" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">G0</text>
    <circle cx="410" cy="300" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="410" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">G1</text>
    <circle cx="300" cy="400" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">G2</text>
    <circle cx="190" cy="300" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="190" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">G3</text>
  </g>
  <!-- clockwise arrows -->
  <line x1="328" y1="228" x2="382" y2="272" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ring)"/>
  <line x1="382" y1="328" x2="328" y2="372" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ring)"/>
  <line x1="272" y1="372" x2="218" y2="328" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ring)"/>
  <line x1="218" y1="272" x2="272" y2="228" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ring)"/>

  <text x="300" y="462" text-anchor="middle" font-size="12.5" fill="#475569">Reduce-scatter phase, then all-gather phase.</text>
  <text x="300" y="480" text-anchor="middle" font-size="12.5" fill="#475569">Bandwidth-optimal · latency grows with N</text>

  <!-- ===== TREE ===== -->
  <text x="900" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed">TREE</text>
  <text x="900" y="144" text-anchor="middle" font-size="12.5" fill="#64748b">NCCL double binary tree — reduce up, broadcast down</text>

  <!-- tree edges -->
  <line x1="820" y1="272" x2="878" y2="205" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="980" y1="272" x2="922" y2="205" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="775" y1="368" x2="808" y2="308" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="865" y1="368" x2="832" y2="308" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="935" y1="368" x2="968" y2="308" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="1025" y1="368" x2="992" y2="308" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#up)"/>

  <!-- tree nodes -->
  <circle cx="900" cy="185" r="30" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="900" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">root</text>
  <circle cx="820" cy="290" r="28" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="820" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">G0</text>
  <circle cx="980" cy="290" r="28" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="980" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">G1</text>
  <circle cx="760" cy="390" r="24" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="760" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">G2</text>
  <circle cx="865" cy="390" r="24" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="865" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">G3</text>
  <circle cx="935" cy="390" r="24" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="935" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">G4</text>
  <circle cx="1040" cy="390" r="24" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1040" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">G5</text>

  <text x="900" y="462" text-anchor="middle" font-size="12.5" fill="#475569">Sum flows up to the root, result flows back down.</text>
  <text x="900" y="480" text-anchor="middle" font-size="12.5" fill="#475569">Latency grows with log N · great for many nodes / small messages</text>

  <!-- ===== COLLECTIVES LEGEND ===== -->
  <text x="600" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">THE COLLECTIVES A TRAINING JOB ACTUALLY USES</text>

  <!-- 5 chips -->
  <!-- broadcast -->
  <rect x="40" y="548" width="218" height="86" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="572" font-size="13.5" font-weight="700" fill="#0f172a">broadcast</text>
  <text x="56" y="592" font-size="11.5" fill="#475569">Startup only.</text>
  <text x="56" y="608" font-size="11.5" fill="#475569">rank-0 weights → all ranks,</text>
  <text x="56" y="623" font-size="11.5" fill="#475569">so everyone starts identical.</text>

  <!-- all-reduce -->
  <rect x="270" y="548" width="218" height="86" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="286" y="572" font-size="13.5" font-weight="700" fill="#2563eb">all-reduce</text>
  <text x="286" y="592" font-size="11.5" fill="#475569">Every step (DDP).</text>
  <text x="286" y="608" font-size="11.5" fill="#475569">Average gradients across all</text>
  <text x="286" y="623" font-size="11.5" fill="#475569">GPUs — the recurring traffic.</text>

  <!-- reduce-scatter -->
  <rect x="500" y="548" width="200" height="86" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="516" y="572" font-size="13.5" font-weight="700" fill="#0d9488">reduce-scatter</text>
  <text x="516" y="592" font-size="11.5" fill="#475569">FSDP / ZeRO.</text>
  <text x="516" y="608" font-size="11.5" fill="#475569">Sum gradients, keep only</text>
  <text x="516" y="623" font-size="11.5" fill="#475569">your slice.</text>

  <!-- all-gather -->
  <rect x="712" y="548" width="196" height="86" rx="9" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="728" y="572" font-size="13.5" font-weight="700" fill="#7c3aed">all-gather</text>
  <text x="728" y="592" font-size="11.5" fill="#475569">FSDP / ZeRO.</text>
  <text x="728" y="608" font-size="11.5" fill="#475569">Share weight slices back so</text>
  <text x="728" y="623" font-size="11.5" fill="#475569">each layer is whole to use.</text>

  <!-- all-to-all -->
  <rect x="920" y="548" width="240" height="86" rx="9" fill="#fef2f2" stroke="#fecaca"/>
  <text x="936" y="572" font-size="13.5" font-weight="700" fill="#dc2626">all-to-all</text>
  <text x="936" y="592" font-size="11.5" fill="#475569">Mixture-of-Experts / expert</text>
  <text x="936" y="608" font-size="11.5" fill="#475569">parallelism. A genuine every-</text>
  <text x="936" y="623" font-size="11.5" fill="#475569">rank-to-every-rank exchange.</text>
</svg>
