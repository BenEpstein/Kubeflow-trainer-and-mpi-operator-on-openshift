<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 828" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1240" height="828" fill="#ffffff"/>

  <!-- title -->
  <text x="620" y="40" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">DDP vs FSDP — one training step</text>
  <text x="620" y="66" text-anchor="middle" font-size="14" fill="#64748b">Both are data-parallel: every GPU gets a different data shard. The difference is what each GPU stores and what crosses the wire.</text>

  <!-- divider -->
  <line x1="620" y1="92" x2="620" y2="708" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============ DDP PANEL ============ -->
  <text x="45" y="118" font-size="19" font-weight="700" fill="#2563eb">DDP · replicate everything</text>
  <text x="45" y="140" font-size="13" fill="#64748b">Each GPU stores the WHOLE model — a full copy ×N.</text>

  <!-- GPU row DDP -->
  <!-- box template: w=126, positions 45,188,331,474 -->
  <!-- GPU0 -->
  <g>
    <rect x="45" y="158" width="126" height="96" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="108" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">GPU 0</text>
    <rect x="58" y="196" width="100" height="20" rx="4" fill="#e2e8f0"/>
    <rect x="58" y="196" width="100" height="20" rx="4" fill="#2563eb"/>
    <text x="108" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">full model</text>
    <text x="108" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">+grads +opt</text>
  </g>
  <!-- GPU1 -->
  <g>
    <rect x="188" y="158" width="126" height="96" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="251" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">GPU 1</text>
    <rect x="201" y="196" width="100" height="20" rx="4" fill="#e2e8f0"/>
    <rect x="201" y="196" width="100" height="20" rx="4" fill="#2563eb"/>
    <text x="251" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">full model</text>
    <text x="251" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">+grads +opt</text>
  </g>
  <!-- GPU2 -->
  <g>
    <rect x="331" y="158" width="126" height="96" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="394" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">GPU 2</text>
    <rect x="344" y="196" width="100" height="20" rx="4" fill="#e2e8f0"/>
    <rect x="344" y="196" width="100" height="20" rx="4" fill="#2563eb"/>
    <text x="394" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">full model</text>
    <text x="394" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">+grads +opt</text>
  </g>
  <!-- GPU3 -->
  <g>
    <rect x="474" y="158" width="126" height="96" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="537" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">GPU 3</text>
    <rect x="487" y="196" width="100" height="20" rx="4" fill="#e2e8f0"/>
    <rect x="487" y="196" width="100" height="20" rx="4" fill="#2563eb"/>
    <text x="537" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">full model</text>
    <text x="537" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">+grads +opt</text>
  </g>

  <text x="322" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">data shard 0 · 1 · 2 · 3   (each GPU a different slice)</text>

  <!-- DDP flow stages -->
  <text x="45" y="322" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">THE STEP</text>

  <!-- stage 1 -->
  <g>
    <rect x="45" y="332" width="555" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="45" y="332" width="6" height="58" rx="3" fill="#2563eb"/>
    <text x="66" y="358" font-size="14" font-weight="700" fill="#1e293b">1 · FORWARD</text>
    <text x="66" y="378" font-size="12.5" fill="#475569">Runs locally on each GPU. No network traffic.</text>
  </g>
  <line x1="322" y1="391" x2="322" y2="405" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- stage 2 -->
  <g>
    <rect x="45" y="406" width="555" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="45" y="406" width="6" height="66" rx="3" fill="#2563eb"/>
    <text x="66" y="432" font-size="14" font-weight="700" fill="#1e293b">2 · BACKWARD</text>
    <text x="66" y="452" font-size="12.5" fill="#475569">Compute local gradients, then</text>
    <rect x="248" y="440" width="118" height="18" rx="9" fill="#2563eb"/>
    <text x="307" y="453" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">ALL-REDUCE</text>
    <text x="372" y="452" font-size="12.5" fill="#475569">grads → averaged</text>
    <text x="66" y="468" font-size="12.5" fill="#475569">across all GPUs (overlapped with backward, bucket by bucket).</text>
  </g>
  <line x1="322" y1="473" x2="322" y2="487" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- stage 3 -->
  <g>
    <rect x="45" y="488" width="555" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="45" y="488" width="6" height="58" rx="3" fill="#2563eb"/>
    <text x="66" y="514" font-size="14" font-weight="700" fill="#1e293b">3 · OPTIMIZER</text>
    <text x="66" y="534" font-size="12.5" fill="#475569">Identical update on every GPU → weights stay in sync forever.</text>
  </g>

  <!-- DDP footer -->
  <rect x="45" y="562" width="555" height="42" rx="8" fill="#eff6ff"/>
  <text x="322" y="582" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">Weights never move · 1 collective / step</text>
  <text x="322" y="598" text-anchor="middle" font-size="12" fill="#3b82f6">HIGH memory · LOW comms</text>

  <!-- ============ FSDP PANEL ============ -->
  <text x="645" y="118" font-size="19" font-weight="700" fill="#7c3aed">FSDP · shard everything</text>
  <text x="645" y="140" font-size="13" fill="#64748b">Each GPU stores only 1/N of the model — gather layers just-in-time.</text>

  <!-- GPU row FSDP: positions 645,788,931,1074 -->
  <!-- GPU0 -->
  <g>
    <rect x="645" y="158" width="126" height="96" rx="8" fill="#f8fafc" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="708" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">GPU 0</text>
    <rect x="658" y="196" width="100" height="20" rx="4" fill="#e2e8f0"/>
    <rect x="658" y="196" width="25" height="20" rx="4" fill="#7c3aed"/>
    <line x1="683" y1="196" x2="683" y2="216" stroke="#ffffff" stroke-width="1"/>
    <line x1="708" y1="196" x2="708" y2="216" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="733" y1="196" x2="733" y2="216" stroke="#cbd5e1" stroke-width="1"/>
    <text x="708" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">¼ of params</text>
    <text x="708" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">+grads +opt</text>
  </g>
  <!-- GPU1 -->
  <g>
    <rect x="788" y="158" width="126" height="96" rx="8" fill="#f8fafc" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="851" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">GPU 1</text>
    <rect x="801" y="196" width="100" height="20" rx="4" fill="#e2e8f0"/>
    <rect x="826" y="196" width="25" height="20" fill="#7c3aed"/>
    <line x1="826" y1="196" x2="826" y2="216" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="851" y1="196" x2="851" y2="216" stroke="#ffffff" stroke-width="1"/>
    <line x1="876" y1="196" x2="876" y2="216" stroke="#cbd5e1" stroke-width="1"/>
    <text x="851" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">¼ of params</text>
    <text x="851" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">+grads +opt</text>
  </g>
  <!-- GPU2 -->
  <g>
    <rect x="931" y="158" width="126" height="96" rx="8" fill="#f8fafc" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="994" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">GPU 2</text>
    <rect x="944" y="196" width="100" height="20" rx="4" fill="#e2e8f0"/>
    <rect x="969" y="196" width="25" height="20" fill="#7c3aed"/>
    <line x1="969" y1="196" x2="969" y2="216" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="994" y1="196" x2="994" y2="216" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="1019" y1="196" x2="1019" y2="216" stroke="#ffffff" stroke-width="1"/>
    <text x="994" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">¼ of params</text>
    <text x="994" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">+grads +opt</text>
  </g>
  <!-- GPU3 -->
  <g>
    <rect x="1074" y="158" width="126" height="96" rx="8" fill="#f8fafc" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="1137" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">GPU 3</text>
    <rect x="1087" y="196" width="100" height="20" rx="4" fill="#e2e8f0"/>
    <rect x="1162" y="196" width="25" height="20" rx="4" fill="#7c3aed"/>
    <line x1="1112" y1="196" x2="1112" y2="216" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="1137" y1="196" x2="1137" y2="216" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="1162" y1="196" x2="1162" y2="216" stroke="#ffffff" stroke-width="1"/>
    <text x="1137" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">¼ of params</text>
    <text x="1137" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">+grads +opt</text>
  </g>

  <text x="922" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">data shard 0 · 1 · 2 · 3   +   each holds a different slice of the weights</text>

  <!-- FSDP flow stages -->
  <text x="645" y="322" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">THE STEP  (per layer, walking the model)</text>

  <!-- stage 1 -->
  <g>
    <rect x="645" y="332" width="555" height="58" rx="8" fill="#faf5ff" stroke="#ddd6fe"/>
    <rect x="645" y="332" width="6" height="58" rx="3" fill="#7c3aed"/>
    <text x="666" y="356" font-size="14" font-weight="700" fill="#1e293b">1 · FORWARD</text>
    <text x="666" y="376" font-size="12" fill="#475569">for each layer:</text>
    <rect x="742" y="364" width="112" height="17" rx="8.5" fill="#7c3aed"/>
    <text x="798" y="376.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">ALL-GATHER</text>
    <text x="860" y="376" font-size="12" fill="#475569">weights → compute → FREE</text>
  </g>
  <line x1="922" y1="391" x2="922" y2="405" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- stage 2 -->
  <g>
    <rect x="645" y="406" width="555" height="66" rx="8" fill="#faf5ff" stroke="#ddd6fe"/>
    <rect x="645" y="406" width="6" height="66" rx="3" fill="#7c3aed"/>
    <text x="666" y="430" font-size="14" font-weight="700" fill="#1e293b">2 · BACKWARD</text>
    <text x="666" y="450" font-size="12" fill="#475569">for each layer:</text>
    <rect x="742" y="438" width="112" height="17" rx="8.5" fill="#7c3aed"/>
    <text x="798" y="450.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">ALL-GATHER</text>
    <text x="860" y="450" font-size="12" fill="#475569">→ grads →</text>
    <rect x="930" y="438" width="140" height="17" rx="8.5" fill="#0d9488"/>
    <text x="1000" y="450.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">REDUCE-SCATTER</text>
    <text x="666" y="466" font-size="12" fill="#475569">each GPU keeps only its ¼ of the averaged gradient, then FREE.</text>
  </g>
  <line x1="922" y1="473" x2="922" y2="487" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- stage 3 -->
  <g>
    <rect x="645" y="488" width="555" height="58" rx="8" fill="#faf5ff" stroke="#ddd6fe"/>
    <rect x="645" y="488" width="6" height="58" rx="3" fill="#7c3aed"/>
    <text x="666" y="514" font-size="14" font-weight="700" fill="#1e293b">3 · OPTIMIZER</text>
    <text x="666" y="534" font-size="12.5" fill="#475569">Each GPU updates only its ¼ shard of the parameters.</text>
  </g>

  <!-- FSDP footer -->
  <rect x="645" y="562" width="555" height="42" rx="8" fill="#faf5ff"/>
  <text x="922" y="582" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6d28d9">Weights cross the wire every layer · ~3× DDP data volume</text>
  <text x="922" y="598" text-anchor="middle" font-size="12" fill="#8b5cf6">LOW memory · HIGH comms  (hidden by prefetch)</text>

  <!-- ============ BOTTOM KEY ============ -->
  <rect x="45" y="640" width="1155" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="66" y="666" font-size="13" font-weight="700" fill="#0f172a">Key idea:</text>
  <text x="140" y="666" font-size="13" fill="#334155">an <tspan font-weight="700" fill="#2563eb">all-reduce</tspan> = <tspan font-weight="700" fill="#0d9488">reduce-scatter</tspan> (split &amp; sum) + <tspan font-weight="700" fill="#7c3aed">all-gather</tspan> (share back), fused together.</text>
  <text x="66" y="690" font-size="13" fill="#334155"><tspan font-weight="700" fill="#2563eb">DDP</tspan> runs the fused all-reduce on gradients only.  <tspan font-weight="700" fill="#7c3aed">FSDP</tspan> splits the halves apart: reduce-scatter for gradients, all-gather for weights — the extra half is the price of sharding.</text>

  <!-- caption -->
  <text x="620" y="760" text-anchor="middle" font-size="13" fill="#64748b">Same rendezvous, same DistributedSampler (different data per GPU). FSDP just adds model sharding on top of data parallelism.</text>
  <text x="620" y="784" text-anchor="middle" font-size="12" fill="#94a3b8">Sharding is tunable: FULL_SHARD (ZeRO-3, shown) · SHARD_GRAD_OP (ZeRO-2) · HYBRID_SHARD (shard in-node, replicate across nodes).</text>
</svg>
